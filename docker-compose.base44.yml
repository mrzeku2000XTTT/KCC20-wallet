services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.main.base44.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
