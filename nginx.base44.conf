server {
    listen 3000;
    server_name _;
    root /app;
    index index.html;

    # Correct MIME for WASM (needed by vendor/*.wasm)
    types {
        application/wasm  wasm;
    }

    # No-cache for HTML/JS/CSS so edits show immediately
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy: cook-api -> external Kaspa API (matches vercel.json rewrite)
    location /cook-api/ {
        proxy_pass https://dev-api-kcc20.kaspa.com/;
        proxy_set_header Host dev-api-kcc20.kaspa.com;
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # Proxy: vprog-tt -> external vprog API (matches vercel.json rewrite)
    location /vprog-tt/ {
        proxy_pass https://vprogs-tt.izio.fr/;
        proxy_set_header Host vprogs-tt.izio.fr;
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # Long-cache WASM assets
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
